version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store_intel_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - DATABASE_URL=sqlite:///data/store_intelligence.db
      - CONFIG_DIR=config
      - FORCE_PROCESS_VIDEOS=false  # Set to true to override database cache and force CV run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store_intel_dashboard
    command: streamlit run app/dashboard/main.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: always
